name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Browsers and their system libraries for the Playwright version in
      # the lockfile.
      - run: pnpm --filter @spatialflex/playground exec playwright install --with-deps chromium firefox

      # Builds the playground and the XR Lab and tests each through
      # `vite preview` (Chromium and Firefox; the XR Lab includes desktop 3D,
      # emulated immersive VR and comparative measurements).
      # Firefox has no WebGL in headless mode on this GPU-less runner, so the
      # XR Lab's Firefox project runs headed under Xvfb (installed above).
      - run: xvfb-run --auto-servernum pnpm test:e2e
        env:
          XR_LAB_FIREFOX_HEADED: "1"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/*/playwright-report/
            apps/*/test-results/
          retention-days: 7
